# Portable defaults; no private configuration is needed for public examples.
# Keep this release-checked file unchanged. Override keys in an external YAML
# selected by QIS_SETTINGS_PATH; see README.md beside this file.

RESOURCE_PATH: '~/.qis/resources'

LOCAL_RESOURCE_PATH: '~/.qis/resources'

UNIVERSE_PATH: '~/.qis/resources/universes'

OUTPUT_PATH: '~/.qis/outputs'

# Inert placeholder for optional database users; no database is configured.
AWS_POSTGRES:
  "postgresql://user:password@database:port"
