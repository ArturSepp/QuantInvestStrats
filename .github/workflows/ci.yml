name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg  # no display on the runner

jobs:
  # the path a reviewer follows: pip install qis, then pytest. Nothing optional installed.
  test:
    name: pytest (core install, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest

    - name: Verify core imports
      run: |
        python -c "
        import qis
        from qis import (
            TimePeriod, PerfParams, PortfolioData,
            compute_ewm, compute_ewm_covar,
            to_returns, backtest_model_portfolio,
            set_group_loadings, generate_rebalancing_indicators,
        )
        print('All imports OK')
        "

    - name: Run tests
      run: pytest

  # the same suite with the optional extras present, so the tests skipped above actually run
  test-extras:
    name: pytest (data + io extras)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[data,io]"
        pip install pytest pytest-cov

    - name: Run tests with coverage
      # the coverage number is reported, not gated: raising it is tracked work, not a merge
      # condition
      run: pytest --cov=qis --cov-report=term:skip-covered

  lint:
    name: ruff (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install ruff
      # pinned exactly: an unpinned linter turns someone else's release into a red build
      run: pip install ruff==0.14.2

    - name: Lint lines changed by this push or pull request
      # the package carries ~2,250 pre-existing violations, so gating whole files would fail on
      # any edit to a legacy file and the check would be routed around. Gating the added lines
      # keeps it green today and still stops new debt. See AGENTS.md, Known issues.
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          BASE="${{ github.event.pull_request.base.sha }}"
        else
          BASE="${{ github.event.before }}"
        fi
        if ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
          echo "no usable base commit for a diff; skipping the gate"
          exit 0
        fi
        python .github/lint_changed_lines.py "$BASE" "${{ github.sha }}"

    - name: Repo-wide violation count (report only, never fails)
      if: always()
      run: ruff check src/qis/ --statistics || true

  wheel:
    # Editable installs exercise the src tree, not the artifact users receive. Build and install
    # the wheel in a clean environment so missing packages, tests or package data cannot pass CI.
    name: built wheel (core install)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Build the wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build --wheel

    - name: Assert package tests and documentation ship
      run: |
        python - <<'PY'
        import glob
        import zipfile

        wheels = glob.glob("dist/*.whl")
        assert len(wheels) == 1, f"expected one wheel, found {wheels}"
        with zipfile.ZipFile(wheels[0]) as archive:
            names = set(archive.namelist())
        tests = [name for name in names if name.startswith("qis/") and name.endswith("_test.py")]
        examples = [name for name in names if name.startswith("qis/examples/")]
        assert tests, "the wheel ships no qis test modules"
        assert not examples, f"repository examples leaked into the wheel: {examples[:5]}"
        assert "qis/docs/plotting_kwargs.md" in names, "the wheel misses packaged documentation"
        assert "qis/settings.yaml" in names, "the wheel misses settings.yaml"
        print(f"{wheels[0]}: {len(tests)} test modules and required package data present")
        PY

    - name: Install the wheel into a clean environment
      run: |
        python -m venv "$RUNNER_TEMP/qis-wheel-venv"
        "$RUNNER_TEMP/qis-wheel-venv/bin/python" -m pip install --upgrade pip
        "$RUNNER_TEMP/qis-wheel-venv/bin/python" -m pip install "$(ls dist/*.whl)" pytest

    - name: Run the shipped suite against the installed wheel
      run: |
        mkdir -p "$RUNNER_TEMP/qis-wheel-check"
        cd "$RUNNER_TEMP/qis-wheel-check"
        "$RUNNER_TEMP/qis-wheel-venv/bin/python" -m pytest --pyargs qis -q \
          --import-mode=importlib
