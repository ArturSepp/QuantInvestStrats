# SHARED CI CORE v1.0 — T2 — synced 2026-08-22
name: CI
run-name: ${{ github.event_name == 'schedule' && 'Dependency compatibility (live resolution)' || 'CI' }}

# Every job only checks out and reads the repository.  Declare the minimum token scope rather
# than inheriting repository defaults, especially for pull requests that execute changed code.
permissions:
  contents: read

on:
  workflow_call:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MPLBACKEND: Agg  # no display on the runner
  PYTHONPATH: ${{ github.workspace }}/.github  # opt-in pytest CI routing plugin

jobs:
  # The Linux cells cover every supported interpreter.  Windows and macOS run the authoritative
  # 3.12 version to exercise platform paths and plotting backends without multiplying the
  # rendering workloads across a 15-cell Cartesian product. All change-validation cells use
  # uv.lock; the scheduled compatibility run resolves current compatible dependencies.
  test:
    name: pytest (core, ${{ matrix.os }}, py${{ matrix.python-version }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    # Every interpreter/platform runs both shards, whose union is the entire numerical suite.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
            shard: 0
          - os: ubuntu-latest
            python-version: "3.10"
            shard: 1
          - os: ubuntu-latest
            python-version: "3.11"
            shard: 0
          - os: ubuntu-latest
            python-version: "3.11"
            shard: 1
          - os: ubuntu-latest
            python-version: "3.12"
            shard: 0
          - os: ubuntu-latest
            python-version: "3.12"
            shard: 1
          - os: ubuntu-latest
            python-version: "3.13"
            shard: 0
          - os: ubuntu-latest
            python-version: "3.13"
            shard: 1
          - os: ubuntu-latest
            python-version: "3.14"
            shard: 0
          - os: ubuntu-latest
            python-version: "3.14"
            shard: 1
          - os: windows-latest
            python-version: "3.12"
            shard: 0
          - os: windows-latest
            python-version: "3.12"
            shard: 1
          - os: macos-latest
            python-version: "3.12"
            shard: 0
          - os: macos-latest
            python-version: "3.12"
            shard: 1

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Sync the core test environment
      # The primary cell fails if pyproject.toml and uv.lock disagree.  Floating cells upgrade the
      # resolution so compatibility with what a new installer receives remains covered.
      run: uv sync --group test ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}

    - name: Run numerical and mixed-contract tests
      run: >-
        uv run --no-sync pytest -p ci_test_suites --ci-suite numerical
        --ci-shard ${{ matrix.shard }} --ci-shards 2 --durations=20

  # Optional numeric/IO tests plus coverage; rendering coverage is combined below.
  test-extras:
    name: pytest (data + io extras, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Coverage took 51 minutes on a slower runner; leave room for runner variation and cleanup.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.12"

    - name: Sync the locked data and io environment
      run: uv sync --group test --extra data --extra io --locked

    - name: Run numerical tests with coverage
      env:
        COVERAGE_FILE: ${{ runner.temp }}/coverage-data/.coverage.numerical-${{ matrix.shard }}
      # A shard cannot enforce the package-wide floor. The combined report below does.
      run: >-
        uv run --no-sync pytest -p ci_test_suites --ci-suite numerical
        --ci-shard ${{ matrix.shard }} --ci-shards 2
        --cov=qis --cov-report= --cov-fail-under=0
        --durations=20 -o faulthandler_timeout=300

    - name: Retain numerical coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-coverage-numerical-${{ matrix.shard }}
        overwrite: true
        path: ${{ runner.temp }}/coverage-data/.coverage.*
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  rendering:
    name: pytest (${{ matrix.suite }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: plots
            shard: 0
            shards: 1
          - suite: factsheets
            shard: 0
            shards: 2
          - suite: factsheets
            shard: 1
            shards: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.12"
    - name: Sync the core rendering environment
      run: uv sync --group test ${{ github.event_name == 'schedule' && '--upgrade' || '--locked' }}
    - name: Run rendering shard with coverage
      env:
        COVERAGE_FILE: ${{ runner.temp }}/coverage-data/.coverage.${{ matrix.suite }}-${{ matrix.shard }}
      run: >-
        uv run --no-sync pytest -p ci_test_suites --ci-suite ${{ matrix.suite }}
        --ci-shard ${{ matrix.shard }} --ci-shards ${{ matrix.shards }}
        --cov=qis --cov-report= --cov-fail-under=0
        --durations=20 -o faulthandler_timeout=300
    - name: Retain rendering coverage
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-coverage-${{ matrix.suite }}-${{ matrix.shard }}
        overwrite: true
        path: ${{ runner.temp }}/coverage-data/.coverage.*
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  coverage:
    name: combined numerical and rendering coverage
    needs: [test-extras, rendering]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.12"
    - name: Sync the locked coverage tools
      run: uv sync --locked --group test
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ci-coverage-*
        merge-multiple: true
        path: ${{ runner.temp }}/coverage-data
    - name: Combine every shard and enforce the existing package-wide floor
      run: |
        uv run --no-sync coverage combine "${{ runner.temp }}/coverage-data"
        uv run --no-sync coverage report --skip-covered

  wheel:
    # Build once: every installed-wheel partition must exercise the same artifact.
    name: build wheel from sdist
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install uv and Python
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.12"

    - name: Build the wheel from the source distribution
      run: |
        uv build --sdist --clear --out-dir dist
        uv build --wheel dist/*.tar.gz --out-dir dist

    - name: Assert package tests and documentation ship
      run: |
        python - <<'PY'
        import glob
        import zipfile

        wheels = glob.glob("dist/*.whl")
        assert len(wheels) == 1, f"expected one wheel, found {wheels}"
        with zipfile.ZipFile(wheels[0]) as archive:
            names = set(archive.namelist())
        tests = [name for name in names if name.startswith("qis/") and name.endswith("_test.py")]
        examples = [name for name in names if name.startswith("qis/examples/")]
        runners = [name for name in names if name.startswith("qis/") and "/run_local/" in name]
        bytecode = [
            name for name in names
            if "/__pycache__/" in name or name.endswith((".pyc", ".pyo"))
        ]
        expected_docs = {
            "qis/docs/plotting_kwargs.md",
            "qis/docs/reporting_frequencies.md",
            "qis/docs/sharpe_conventions.md",
            "qis/docs/portfolio_stress.md",
        }
        expected_stress = {
            "qis/portfolio/stress/__init__.py",
            "qis/portfolio/stress/instruments.py",
            "qis/portfolio/stress/portfolio.py",
            "qis/portfolio/stress/scenarios.py",
            "qis/portfolio/stress/analytics.py",
            "qis/portfolio/stress/reporting.py",
            "qis/portfolio/stress/_figures.py",
            "qis/portfolio/stress/tests/public_api_test.py",
        }
        missing_stress = sorted(expected_stress - names)
        assert not missing_stress, f"the wheel misses stress interfaces: {missing_stress}"
        missing_docs = sorted(expected_docs - names)
        assert tests, "the wheel ships no qis test modules"
        assert not examples, f"repository examples leaked into the wheel: {examples[:5]}"
        assert not runners, f"development runners leaked into the wheel: {runners[:5]}"
        assert not bytecode, f"Python bytecode leaked into the wheel: {bytecode[:5]}"
        assert not missing_docs, f"the wheel misses packaged documentation: {missing_docs}"
        assert "qis/settings.yaml" in names, "the wheel misses settings.yaml"
        print(f"{wheels[0]}: {len(tests)} test modules and required package data present")
        PY

    - name: Retain the exact wheel for every installed-artifact test
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-tested-wheel
        overwrite: true
        path: dist/*.whl
        if-no-files-found: error
        retention-days: 7

  wheel-tests:
    name: installed wheel (${{ matrix.suite }}, shard ${{ matrix.shard }})
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: numerical
            shard: 0
            shards: 2
          - suite: numerical
            shard: 1
            shards: 2
          - suite: plots
            shard: 0
            shards: 1
          - suite: factsheets
            shard: 0
            shards: 2
          - suite: factsheets
            shard: 1
            shards: 2
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        python-version: "3.12"
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ci-tested-wheel
        path: dist
    - name: Install the wheel into a clean environment
      run: |
        uv venv --python 3.12 "$RUNNER_TEMP/qis-wheel-venv"
        uv pip install --python "$RUNNER_TEMP/qis-wheel-venv/bin/python" \
          "$(ls dist/*.whl)" pytest

    - name: Run the offline quickstart against the installed wheel
      if: matrix.suite == 'numerical' && matrix.shard == 0
      # Execute from outside the checkout.  The script path is repository-owned documentation,
      # but its qis import and synthetic data resolve entirely through the clean wheel environment.
      run: |
        mkdir -p "$RUNNER_TEMP/qis-quickstart-check"
        cd "$RUNNER_TEMP/qis-quickstart-check"
        "$RUNNER_TEMP/qis-wheel-venv/bin/python" \
          "$GITHUB_WORKSPACE/examples/getting_started/offline_quickstart.py" | tee quickstart.txt
        grep -F "Final NAV: 119.9866" quickstart.txt
        grep -F "TE=0.0299, IR=-0.2899" quickstart.txt

    - name: Run the shipped partition against the installed wheel
      run: |
        mkdir -p "$RUNNER_TEMP/qis-wheel-check"
        cd "$RUNNER_TEMP/qis-wheel-check"
        "$RUNNER_TEMP/qis-wheel-venv/bin/python" -m pytest --pyargs qis -q \
          --import-mode=importlib -p ci_test_suites --ci-suite ${{ matrix.suite }} \
          --ci-shard ${{ matrix.shard }} --ci-shards ${{ matrix.shards }} --durations=20

  stack-policy:
    name: stack import boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Exercise policy regressions
        run: python .github/scripts/check_stack_imports.py --self-test
      - name: Check stack imports and optional adapter isolation
        run: python .github/scripts/check_stack_imports.py

  lowest-dependencies:
    # Floor resolution is compatibility maintenance, not a verdict on an unrelated edit.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: lowest direct dependencies (Python 3.10)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.10"
      - name: Keep the test environment outside the checkout
        run: echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/lowest-dependencies" >> "$GITHUB_ENV"
      - name: Resolve a fresh lowest-direct test environment
        # Upgrade ignores lockfile preference; this job never commits its experimental lock.
        run: uv sync --python 3.10 --resolution lowest-direct --upgrade --group test
      - name: Record installed versions
        run: uv pip freeze --python "$UV_PROJECT_ENVIRONMENT/bin/python"
      - name: Check optional dependencies stay outside package-root import
        run: uv run --no-sync python .github/scripts/check_stack_imports.py --check-root
      - name: Test declared dependency floors without live provider credentials
        run: uv run --no-sync pytest -x
