version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: daily
    # Security updates still open PRs; suppress routine version-update PRs.
    open-pull-requests-limit: 0
